<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SF Adventures</title>
  <meta name="description" content="What should we do today? A shared deck of San Francisco adventures for two.">
  <link rel="manifest" href="./manifest.webmanifest">
  <meta name="theme-color" content="#1F6E93">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="appbar">
    <nav class="tabs" role="tablist">
      <button class="tab" data-tab="today" role="tab" aria-selected="true">Today</button>
      <button class="tab" data-tab="browse" role="tab" aria-selected="false">Browse</button>
      <button class="tab" data-tab="settings" role="tab" aria-selected="false">Settings</button>
    </nav>
  </header>
  <div class="banner" id="banner"></div>
  <main class="wrap" id="main"></main>
  <div class="statsbar"><div class="stats" id="stats"></div></div>
  <div class="toast" id="toast"></div>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
